name: Image (branch)

# Builds the runtime image from a branch and pushes it to GHCR under a
# branch-specific tag. Used to validate a release candidate on the cluster
# before it is merged into main (the Deploy workflow owns `latest`).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (defaults to a slug of the branch)
        required: false

concurrency:
  group: image-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push branch image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: |
          raw="${{ inputs.tag }}"
          if [ -z "$raw" ]; then
            raw="${GITHUB_REF_NAME}"
          fi
          echo "value=$(echo "$raw" | tr '[:upper:]_' '[:lower:]-' | tr -cd 'a-z0-9.-')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
